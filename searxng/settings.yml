# SearXNG settings - see https://docs.searxng.org/admin/settings/
use_default_settings: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

server:
  secret_key: "knowledge-agent-searxng-secret-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  method: "GET"

# Disable bot detection for local API access
botdetection:
  ip_limit:
    link_token: false
    filter_link_token: false

ui:
  static_use_hash: true
  default_theme: simple

# Enabled search engines
engines:
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false

outgoing:
  # Proxy for outbound requests to search engines
  # Uses Docker host's proxy to access internet
  proxies:
    all://:
      - http://host.docker.internal:7897
